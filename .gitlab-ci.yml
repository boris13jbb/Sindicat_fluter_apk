# CI/CD — VotaSind (Flutter + Firebase)
# Documentación: docs/deployment/ci.md

stages:
  - quality
  - test

variables:
  FLUTTER_VERSION: stable

.flutter_before_script: &flutter_before_script
  - flutter pub get

flutter_quality:
  stage: quality
  image: ghcr.io/cirruslabs/flutter:stable
  before_script: *flutter_before_script
  script:
    - dart format --output=none --set-exit-if-changed lib test
    - dart analyze lib test
    - flutter test --no-pub --enable-experiment=dot-shorthands --reporter compact

functions_test:
  stage: test
  image: node:22-bookworm
  before_script:
    - cd functions && npm ci
  script:
    - npm run check

firestore_rules:
  stage: test
  image: node:22-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-21-jre-headless
    - npm ci
    - npm install -g firebase-tools
  script:
    - bash tool/test_firebase_rules.sh
